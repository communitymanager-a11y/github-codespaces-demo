<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MuJoCo ブラウザ検証</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <section id="viewer">
        <div id="loading">MuJoCo を読み込み中…</div>
      </section>

      <aside>
        <h1>MuJoCo ブラウザ検証</h1>

        <h2>操作</h2>
        <div class="pad">
          <button data-cmd="up">上</button>
          <button data-cmd="forward">前</button>
          <button data-cmd="down">下</button>
          <button data-cmd="left">左</button>
          <button data-cmd="back">後ろ</button>
          <button data-cmd="right">右</button>
        </div>
        <div class="row">
          <button data-cmd="grab">つかむ</button>
          <button data-cmd="release">はなす</button>
          <button data-cmd="reset">リセット</button>
        </div>

        <h2>音声入力</h2>
        <button id="mic" class="toggle">🎤 聞き取り開始</button>
        <p class="hint">例:「前、下、下、下、つかんで、上、左、はなして」</p>
        <p id="transcript" class="transcript">—</p>
        <form id="text-form" class="row">
          <input id="text-input" placeholder="文字でも入力できます" />
          <button type="submit">実行</button>
        </form>

        <h2>カメラ入力</h2>
        <button id="camera" class="toggle">📷 カメラ開始</button>
        <video id="video" playsinline muted></video>

        <p id="error" class="error" hidden></p>

        <h2>状態</h2>
        <dl id="status"></dl>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
